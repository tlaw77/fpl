  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">FPL DECISION CENTRE</p>
        <h1 id="league-title">Loading…</h1>
        <p class="subtle" id="last-updated">Loading latest decision snapshot…</p>
      </div>
      <div class="gw-pill" id="gw-pill">GW —</div>
    </header>

    <section class="kpi-grid" id="kpi-grid"></section>

    <nav class="decision-nav" id="decision-nav" aria-label="Dashboard views">
      <button data-view="transfer">Transfer</button>
      <button data-view="team">Pick Team</button>
      <button data-view="shape">Squad Shape</button>
      <button data-view="pool">Player Pool</button>
      <button data-view="intel">League Intel</button>
    </nav>

    <section class="dashboard-view active" id="view-transfer"><div id="dc-transfer-view"></div><div id="decision-history-panel"></div></section>
    <section class="dashboard-view" id="view-team"><div id="dc-team-view"></div></section>
    <section class="dashboard-view" id="view-shape"><div id="dc-shape-view"></div></section>
    <section class="dashboard-view" id="view-pool"><div id="dc-pool-view"><section class="dc-card"><p class="eyebrow">PLAYER POOL</p><h3>Player rankings</h3><p>Model, fixtures, Scout consensus and market signals are combined here.</p></section></div></section>
    <section class="dashboard-view" id="view-intel"><div id="dc-intel-view"><section class="dc-card"><p class="eyebrow">LEAGUE INTEL</p><h3>Rival intelligence</h3><p>Standings, exposure, leverage and recent movement.</p></section></div></section>

    <footer>FPL Decision Centre</footer>
