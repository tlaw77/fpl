<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>FPL Recovery</title><style>body{margin:0;background:#08111f;color:#edf4ff;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#101d31;border:1px solid #29405f;border-radius:18px;padding:18px;margin:14px 0}h1{font-size:30px;margin:6px 0 10px}h2{font-size:18px}.ok{color:#52e0ae}.bad{color:#ff8aa0}.warn{color:#ffd166}pre{white-space:pre-wrap;word-break:break-word;background:#07101c;padding:12px;border-radius:12px;font-size:12px}button,a.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:14px;margin-top:10px;background:#dfff3f;color:#09111d;text-align:center;font-weight:800;text-decoration:none;font-size:16px}</style></head><body><div class="wrap"><div class="card"><div style="letter-spacing:.16em;color:#82d8ff;font-weight:800;font-size:12px">FPL RECOVERY</div><h1>Client-state diagnostic</h1><p>This page does not load the dashboard modules. It checks only your saved browser state and the live data feed.</p></div><div id="state" class="card">Checking local state…</div><div id="feed" class="card">Checking data feed…</div><div class="card"><button id="sanitize">Sanitize saved working plan</button><button id="clear">Clear saved working plan</button><a class="btn" href="./?recovered=1&v=20260827-0130">Open dashboard after recovery</a></div><div class="card"><h2>Technical detail</h2><pre id="detail"></pre></div></div><script>(async()=>{const KEY='fplWorkingPlanV2',state=document.getElementById('state'),detail=document.getElementById('detail');let raw=null,p=null,info={};try{raw=localStorage.getItem(KEY);info.rawLength=raw?.length||0;p=raw?JSON.parse(raw):null;info.parseOk=true;info.moves=Array.isArray(p?.moves)?p.moves.length:0;info.hasUplift=!!p?.moves?.some(m=>m&&('uplift_snapshot'in m));info.keys=p?Object.keys(p):[];state.innerHTML='<h2 class="ok">Browser storage readable</h2><p>Working plan size: <b>'+info.rawLength+'</b> chars · moves: <b>'+info.moves+'</b> · uplift snapshot present: <b>'+info.hasUplift+'</b></p>';}catch(e){info.parseOk=false;info.storageError=String(e);state.innerHTML='<h2 class="bad">Saved state is invalid</h2><p>'+String(e)+'</p>';}try{const t=performance.now();const r=await fetch('https://raw.githubusercontent.com/tlaw77/fpl/main/data/latest.json?recover='+Date.now(),{cache:'no-store'});const txt=await r.text();const ms=Math.round(performance.now()-t);const d=JSON.parse(txt);info.feed={status:r.status,ms,bytes:txt.length,league:d?.league?.name,gw:d?.current_gw,next:d?.next_gw,generated:d?.generated_at_utc};document.getElementById('feed').innerHTML='<h2 class="ok">Live feed OK</h2><p>'+info.feed.league+' · GW '+info.feed.gw+' → '+info.feed.next+' · '+info.feed.bytes.toLocaleString()+' bytes · '+ms+' ms</p>';}catch(e){info.feedError=String(e);document.getElementById('feed').innerHTML='<h2 class="bad">Live feed failed</h2><p>'+String(e)+'</p>';}detail.textContent=JSON.stringify(info,null,2);document.getElementById('sanitize').onclick=()=>{try{if(!raw){alert('No saved working plan found.');return}const obj=JSON.parse(raw);const clean=JSON.parse(JSON.stringify(obj,(k,v)=>k==='uplift_snapshot'?undefined:v));localStorage.setItem(KEY+'_backup_20260827',raw);localStorage.setItem(KEY,JSON.stringify(clean));alert('Sanitized. A backup was saved. Now open the dashboard.');location.href='./?recovered=sanitize&v=20260827-0130';}catch(e){alert('Sanitize failed: '+e)}};document.getElementById('clear').onclick=()=>{try{if(raw)localStorage.setItem(KEY+'_backup_20260827',raw);localStorage.removeItem(KEY);alert('Working plan cleared. Backup retained.');location.href='./?recovered=clear&v=20260827-0130';}catch(e){alert('Clear failed: '+e)}}})();</script></body></html>
