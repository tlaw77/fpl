name: Elite FPL Benchmark

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["FPL ETL"]
    types: [completed]
  push:
    paths:
      - "elite_benchmark.py"
      - ".github/workflows/elite-benchmark.yml"

concurrency:
  group: elite-fpl-benchmark
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build elite FPL benchmark
        run: python elite_benchmark.py
        continue-on-error: true
      - name: Commit benchmark snapshot
        run: |
          if [ ! -f data/elite_benchmark.json ]; then
            echo "No elite benchmark snapshot produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elite_benchmark.json
          if git diff --cached --quiet; then
            echo "No elite benchmark changes"
          else
            git commit -m "Update elite FPL benchmark"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              echo "Benchmark push raced with another writer; retrying ($attempt/5)"
              sleep $((attempt * 2))
            done
            echo "Benchmark push failed after 5 attempts"
            exit 1
          fi
