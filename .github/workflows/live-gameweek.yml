name: Live Gameweek

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["FPL ETL"]
    types: [completed]
  schedule:
    # Keep the five-minute cadence but avoid the busiest top-of-hour minute.
    - cron: "2-57/5 * * * *"
  push:
    paths:
      - "live_gameweek.py"
      - "tests/test_live_gameweek.py"
      - ".github/workflows/live-gameweek.yml"

concurrency:
  # One continuous session owns live-data. New cron events queue behind it
  # instead of cancelling a healthy five-minute refresh loop.
  group: live-gameweek-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select fixture-aware cadence
        id: cadence
        run: python3 live_gameweek.py --gate >> "$GITHUB_OUTPUT"
      - name: Show cadence decision
        run: |
          echo "### Live Gameweek cadence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Phase: ${{ steps.cadence.outputs.phase }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full refresh: ${{ steps.cadence.outputs.run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ steps.cadence.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Validate live contract
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        run: python -m unittest tests.test_live_gameweek -v
      - name: Run continuous live session
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        env:
          LIVE_INTERVAL_SECONDS: "285"
          MAX_SESSION_SECONDS: "19800"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live-data
          git worktree add --detach "$RUNNER_TEMP/fpl-live-data" origin/live-data
          started_at=$(date +%s)

          while true; do
            python live_gameweek.py
            phase=$(python -c "import json; print(json.load(open('data/live_gameweek.json'))['phase'])")
            generated=$(python -c "import json; print(json.load(open('data/live_gameweek.json'))['generated_at_utc'])")
            cp data/live_gameweek.json "$RUNNER_TEMP/fpl-live-data/data/live_gameweek.json"

            pushd "$RUNNER_TEMP/fpl-live-data" >/dev/null
            git add data/live_gameweek.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh live gameweek command centre"
              pushed=false
              for attempt in 1 2 3; do
                if git push origin HEAD:live-data; then
                  pushed=true
                  break
                fi
                git pull --rebase origin live-data
                sleep $((attempt * 2))
              done
              if [ "$pushed" != "true" ]; then exit 1; fi
            fi
            popd >/dev/null

            echo "Published $phase snapshot generated $generated"
            elapsed=$(( $(date +%s) - started_at ))
            if [ "$phase" = "PRE_DEADLINE" ] || [ "$phase" = "COMPLETE" ] || [ "$elapsed" -ge "$MAX_SESSION_SECONDS" ]; then
              break
            fi
            sleep "$LIVE_INTERVAL_SECONDS"
          done
