name: FPL ETL

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - "fpl_etl.py"
      - "current_squad.py"
      - "recommendation_history.py"
      - "decision_journal.py"
      - "strategy_watch.py"
      - "market_watch.py"
      - "squad_intelligence.py"
      - "chip_window.py"
      - "player_pool.py"
      - "scout_consensus.py"
      - "exposure_semantics.py"
      - ".github/workflows/fpl-etl.yml"

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run FPL ETL
        run: python fpl_etl.py

      - name: Preserve recommendation snapshot
        run: python recommendation_history.py

      - name: Reconstruct current squad
        run: python current_squad.py

      - name: Build durable decision journal
        run: python decision_journal.py

      - name: Normalize exposure semantics
        run: python exposure_semantics.py

      - name: Run strategy watch
        run: python strategy_watch.py

      - name: Run market watch
        run: python market_watch.py

      - name: Run squad intelligence
        run: python squad_intelligence.py

      - name: Run chip window evaluation
        run: python chip_window.py

      - name: Run six-GW player pool
        run: python player_pool.py

      - name: Run scout consensus
        run: python scout_consensus.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/latest.json').read_text())
          strategy = json.loads(Path('data/strategy.json').read_text())
          market = json.loads(Path('data/market.json').read_text())
          squad_intel = json.loads(Path('data/squad_intelligence.json').read_text())
          chip_window = json.loads(Path('data/chip_window.json').read_text())
          player_pool = json.loads(Path('data/player_pool.json').read_text())
          scout_consensus = json.loads(Path('data/scout_consensus.json').read_text())
          history = json.loads(Path('data/decision_history.json').read_text())
          rec_history = json.loads(Path('data/recommendation_history.json').read_text())
          assert data['status'] == 'SUCCESS'
          assert data['squad_valid'] is True
          assert data['squad_count'] == 15
          assert len(data.get('current_squad_next5', data['squad_next5'])) == 15
          assert data['league']['manager_count'] >= 1
          assert 'next_gw_decisions' in data
          assert 'current_next_gw_decisions' in data
          assert data.get('exposure_semantics', {}).get('version') == 2
          assert all(x.get('classification') != 'leverage' or (x.get('my_multiplier') or 0) > 0 for x in data.get('player_exposure', []) if x.get('in_my_team'))
          assert strategy['status'] == 'SUCCESS'
          assert len(strategy['managers']) == data['league']['manager_count']
          assert market['status'] == 'SUCCESS'
          assert squad_intel['status'] == 'SUCCESS'
          assert len(squad_intel['managers']) == data['league']['manager_count']
          assert chip_window['status'] == 'SUCCESS'
          assert len(chip_window['evaluations']) == 4
          assert player_pool['status'] == 'SUCCESS'
          assert player_pool['horizon'] == 6
          assert len(player_pool['players']) > 50
          assert scout_consensus['status'] == 'SUCCESS'
          assert 'players' in scout_consensus
          assert history.get('version') == 4
          assert 'weeks' in history
          assert 'decisions' in history
          assert 'snapshots' in rec_history
          print('Validation passed')
          PY

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Update FPL snapshot"
            git pull --rebase origin main
            git push origin main
          fi
