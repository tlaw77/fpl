name: FPL ETL

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - "fpl_etl.py"
      - "current_squad.py"
      - "declared_transfer_overlay.py"
      - "data/declared_transfers.json"
      - "budget_state.py"
      - "full_squad_chip_optimizer.py"
      - "full_squad_chip_optimizer_v2.py"
      - "recommendation_history.py"
      - "decision_journal.py"
      - "strategy_watch.py"
      - "market_watch.py"
      - "squad_intelligence.py"
      - "chip_window.py"
      - "schedule_load.py"
      - "player_pool.py"
      - "scout_consensus.py"
      - "projection_calibration.py"
      - "captaincy_model.py"
      - "simulation_engine.py"
      - "simulation_engine_v2.py"
      - "path_simulation.py"
      - "path_simulation_v3.py"
      - "adaptive_rival_simulation.py"
      - "adaptive_rival_simulation_v2.py"
      - "chip_path_simulation.py"
      - "chip_path_simulation_v2.py"
      - "decision_synthesis.py"
      - "exposure_semantics.py"
      - "archive_week.py"
      - ".github/workflows/fpl-etl.yml"

concurrency:
  group: fpl-etl-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve completed gameweek before rollover
        run: python archive_week.py
      - name: Run FPL ETL
        run: python fpl_etl.py
      - name: Preserve recommendation snapshot
        run: python recommendation_history.py
      - name: Reconstruct current squad
        run: python current_squad.py
      - name: Apply declared pending transfers
        run: python declared_transfer_overlay.py
      - name: Build current squad budget state
        run: python budget_state.py
      - name: Build durable decision journal
        run: python decision_journal.py
      - name: Normalize exposure semantics
        run: python exposure_semantics.py
      - name: Run strategy watch
        run: python strategy_watch.py
      - name: Run market watch
        run: python market_watch.py
      - name: Run squad intelligence
        run: python squad_intelligence.py
      - name: Run chip window evaluation
        run: python chip_window.py
      - name: Run club and player schedule-load watch
        run: python schedule_load.py
      - name: Run six-GW player pool
        run: python player_pool.py
      - name: Run scout consensus
        run: python scout_consensus.py
      - name: Run calibrated rival-aware Monte Carlo simulation
        run: python simulation_engine_v2.py
      - name: Run calibrated multi-gameweek path simulation
        run: python path_simulation_v3.py
      - name: Run probabilistic adaptive-rival challenger simulation
        run: python adaptive_rival_simulation_v2.py
      - name: Run calibrated TC and BB chip-path simulation
        run: python chip_path_simulation_v2.py
      - name: Run bounded legal Wildcard and Free Hit squad optimiser
        run: python full_squad_chip_optimizer_v2.py
      - name: Synthesize authoritative decision
        run: python decision_synthesis.py
      - name: Refresh history index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from archive_week import update_index
          data = json.loads(Path('data/latest.json').read_text())
          update_index(current_live_gw=data.get('current_gw'))
          PY
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/latest.json').read_text())
          strategy = json.loads(Path('data/strategy.json').read_text())
          market = json.loads(Path('data/market.json').read_text())
          squad_intel = json.loads(Path('data/squad_intelligence.json').read_text())
          chip_window = json.loads(Path('data/chip_window.json').read_text())
          schedule_load = json.loads(Path('data/schedule_load.json').read_text())
          player_pool = json.loads(Path('data/player_pool.json').read_text())
          scout_consensus = json.loads(Path('data/scout_consensus.json').read_text())
          simulation = json.loads(Path('data/simulation.json').read_text())
          path_sim = json.loads(Path('data/path_simulation.json').read_text())
          adaptive_sim = json.loads(Path('data/adaptive_rival_simulation.json').read_text())
          chip_path_sim = json.loads(Path('data/chip_path_simulation.json').read_text())
          budget_state = json.loads(Path('data/budget_state.json').read_text())
          full_chip = json.loads(Path('data/full_squad_chip_optimizer.json').read_text())
          synthesis = json.loads(Path('data/decision_synthesis.json').read_text())
          history = json.loads(Path('data/decision_history.json').read_text())
          rec_history = json.loads(Path('data/recommendation_history.json').read_text())
          history_index = json.loads(Path('data/history/index.json').read_text())
          declared = json.loads(Path('data/declared_transfers.json').read_text()) if Path('data/declared_transfers.json').exists() else {'transfers': []}

          assert data['status'] == 'SUCCESS' and data['squad_valid'] is True and data['squad_count'] == 15
          assert len(data.get('current_squad_next5', data['squad_next5'])) == 15
          assert data['league']['manager_count'] >= 1
          assert 'next_gw_decisions' in data and 'current_next_gw_decisions' in data
          pending_declared = [t for t in declared.get('transfers', []) if int(t.get('event') or 0) == int(data.get('next_gw') or 0)]
          if pending_declared and data.get('declared_transfer_overlay_status') == 'pending_official_api':
              squad_ids = {int(p.get('player_id') or 0) for p in data.get('current_squad_next5', [])}
              assert all(int(t['element_in']) in squad_ids and int(t['element_out']) not in squad_ids for t in pending_declared)
          assert int(data.get('free_transfers_remaining_next_gw', 0)) >= 0
          assert int(data.get('next_transfer_hit_cost', 0)) in (0, 4)
          assert data.get('exposure_semantics', {}).get('version') == 2

          assert strategy['status'] == 'SUCCESS' and len(strategy['managers']) == data['league']['manager_count']
          assert market['status'] == 'SUCCESS'
          assert squad_intel['status'] == 'SUCCESS' and len(squad_intel['managers']) == data['league']['manager_count']
          assert chip_window['status'] == 'SUCCESS' and len(chip_window['evaluations']) == 4
          assert schedule_load['status'] == 'SUCCESS' and 'clubs' in schedule_load and 'players' in schedule_load
          assert len(schedule_load.get('failures', [])) < len(schedule_load.get('coverage', [])), 'All schedule-load sources failed'
          assert player_pool['status'] == 'SUCCESS' and player_pool['horizon'] == 6 and len(player_pool['players']) > 50
          assert scout_consensus['status'] == 'SUCCESS' and 'players' in scout_consensus

          assert simulation['status'] == 'SUCCESS' and simulation.get('engine_version', 0) >= 5
          assert str(simulation.get('projection_model', '')).startswith('season-maturity calibrated')
          assert simulation['iterations'] >= 1000 and simulation['candidate_count'] >= 1 and simulation.get('recommendation') is not None
          assert simulation.get('next_transfer_hit_cost') == data.get('next_transfer_hit_cost')
          contract = simulation.get('backtest_contract') or {}
          baseline_xi = {int(x) for x in contract.get('baseline_xi_ids', [])}
          baseline_cap = int(contract.get('baseline_captain_id') or 0)
          assert len(baseline_xi) == 11 and baseline_cap in baseline_xi
          for route in simulation.get('routes', []):
              xi = {int(x) for x in route.get('post_transfer_xi_ids', [])}
              cap = int(route.get('post_transfer_captain_id') or 0)
              assert len(xi) == 11 and cap in xi

          assert path_sim['status'] == 'SUCCESS' and path_sim.get('engine_version', 0) >= 5
          assert str(path_sim.get('projection_model', '')).startswith('season-maturity calibrated')
          assert path_sim['iterations'] >= 1000 and len(path_sim.get('paths', [])) >= 1 and path_sim.get('recommendation') is not None
          assert path_sim.get('starting_free_transfers') == data.get('free_transfers_remaining_next_gw')

          assert adaptive_sim['status'] == 'SUCCESS' and adaptive_sim.get('engine_version', 0) >= 2
          assert str(adaptive_sim.get('projection_model', '')).startswith('season-maturity calibrated')
          assert adaptive_sim['iterations'] >= 1000 and len(adaptive_sim.get('paths', [])) >= 1 and adaptive_sim.get('recommendation') is not None
          assert len(adaptive_sim.get('rival_behaviour', [])) == len(data.get('rivals', []))

          assert chip_path_sim['status'] == 'SUCCESS' and chip_path_sim.get('engine_version', 0) >= 2
          assert str(chip_path_sim.get('projection_model', '')).startswith('season-maturity calibrated')
          assert chip_path_sim['iterations'] >= 1000 and chip_path_sim.get('best_no_chip_path') is not None

          assert budget_state['status'] == 'SUCCESS' and budget_state.get('spendable_budget', 0) > 0
          assert full_chip['status'] == 'SUCCESS' and full_chip.get('version', 0) >= 1
          assert str(full_chip.get('projection_model', '')).startswith('season-maturity calibrated')
          assert full_chip.get('best_wildcard') is not None and full_chip.get('best_free_hit') is not None
          for candidate in [full_chip['best_wildcard'], full_chip['best_free_hit']]:
              squad = candidate.get('squad', [])
              assert len(squad) == 15
              pos = {k: sum(1 for x in squad if x.get('position') == k) for k in ('GKP','DEF','MID','FWD')}
              assert pos == {'GKP':2,'DEF':5,'MID':5,'FWD':3}
              clubs = {}
              for x in squad: clubs[x.get('club')] = clubs.get(x.get('club'), 0) + 1
              assert max(clubs.values()) <= 3
              assert candidate.get('cost', 999) <= full_chip.get('budget', 0) + 1e-6

          assert synthesis['status'] == 'SUCCESS' and synthesis.get('version', 0) >= 2
          assert synthesis.get('current_action', {}).get('action') in ('HOLD', 'TRANSFER')
          assert data.get('decision_synthesis', {}).get('version') == synthesis.get('version')
          assert synthesis.get('chips', {}).get('action') in ('HOLD', 'CONSIDER')

          assert history.get('version') == 4 and 'weeks' in history and 'decisions' in history
          assert 'snapshots' in rec_history and history_index.get('version') == 1
          current_gw = int(data.get('current_gw') or 0)
          if current_gw > 1:
              prev_gw = current_gw - 1
              prev_manifest = Path(f'data/history/gw{prev_gw}/manifest.json')
              assert prev_manifest.exists(), f'Missing finalized history for GW{prev_gw}'
              manifest = json.loads(prev_manifest.read_text())
              archived = {x['name'] for x in manifest.get('files', [])}
              required = {'league_snapshot.json','dashboard_snapshot.json','strategy.json','market.json','squad_intelligence.json','chip_window.json','player_pool.json','scout_consensus.json','decision_history.json','recommendation_history.json','player_outcomes.json'}
              if prev_gw >= 2: required.add('schedule_load.json')
              assert required.issubset(archived), f'GW{prev_gw} archive incomplete: {sorted(required-archived)}'
          print('Validation passed')
          PY
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Update FPL snapshot"
            git pull --rebase origin main
            git push origin main
          fi
