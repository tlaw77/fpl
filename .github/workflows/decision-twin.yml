name: FPL Decision Twin

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - "decision_twin.py"
      - "tests/test_decision_twin.py"
      - ".github/workflows/decision-twin.yml"

concurrency:
  group: fpl-decision-twin
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Decision Twin
        run: python decision_twin.py
      - name: Run Decision Twin contract tests
        run: python -m unittest tests/test_decision_twin.py
      - name: Validate decision artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          twin = json.loads(Path('data/decision_twin.json').read_text())
          assert twin['status'] == 'SUCCESS' and twin.get('version', 0) >= 1
          assert twin.get('progress', {}).get('completion_pct') == 100
          certificate = twin.get('decision_certificate') or {}
          assert certificate.get('certificate_id') and certificate.get('action') in ('HOLD', 'TRANSFER')
          assert certificate.get('headline') and certificate.get('rationale')
          assert certificate.get('evidence', {}).get('newest_at_utc')
          council = twin.get('council') or []
          assert len(council) == 6 and len({row.get('agent') for row in council}) == 6
          assert all(row.get('verdict') in ('SUPPORT','CHALLENGE','WATCH','HOLD','CONTESTED') for row in council)
          assert all(0 <= int(row.get('confidence', -1)) <= 100 for row in council)
          assert len(twin.get('change_radar', {}).get('decision_breakers', [])) >= 3
          learning = twin.get('learning_contract') or {}
          xi = {int(x) for x in learning.get('baseline_xi_ids', [])}
          assert len(xi) == 11 and int(learning.get('baseline_captain_id') or 0) in xi
          print('Decision Twin validation passed', certificate['certificate_id'])
          PY
      - name: Commit Decision Twin snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decision_twin.json
          if git diff --cached --quiet; then
            echo "No Decision Twin change"
          else
            git commit -m "Refresh FPL Decision Twin"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              echo "Decision Twin push raced with another writer; retrying ($attempt/3)"
              sleep $((attempt * 2))
            done
            echo "Decision Twin push failed after 3 attempts"
            exit 1
          fi
