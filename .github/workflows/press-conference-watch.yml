name: Press Conference Watch

on:
  workflow_dispatch:

# The main FPL ETL refreshes and publishes news before projections.
# This manual diagnostic must not race that atomic publication.
concurrency:
  group: press-conference-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh press conference evidence
        run: python press_conference_watch.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/press_conference_watch.json').read_text())
          assert x['status']=='SUCCESS'
          assert 'players' in x and 'friday_press_window' in x
          print('press conference watch valid', x.get('article_count'), len(x.get('players',[])))
          PY
