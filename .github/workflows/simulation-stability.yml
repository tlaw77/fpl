name: Simulation Stability

on:
  workflow_run:
    workflows: ["FPL ETL"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - "simulation_stability.py"
      - "chip_activation_gate.py"
      - ".github/workflows/simulation-stability.yml"

concurrency:
  group: fpl-simulation-stability
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  summarize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stability history
        run: python simulation_stability.py
      - name: Build chip activation gate
        run: python chip_activation_gate.py
      - name: Validate supplemental outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/simulation_stability.json').read_text())
          gate = json.loads(Path('data/chip_activation_gate.json').read_text())
          assert data['status'] == 'SUCCESS'
          assert data.get('version', 0) >= 2
          assert data.get('snapshot_count', 0) >= 1
          assert data.get('snapshot_count', 0) <= 192
          summary = data.get('summary') or {}
          assert summary.get('window_runs', 0) >= 1
          assert float(summary.get('effective_evidence_runs', 0)) > 0
          assert 0 <= float(summary.get('action_persistence_pct', 0)) <= 100
          assert 0 <= float(summary.get('leader_persistence_pct', 0)) <= 100
          assert gate['status'] == 'SUCCESS'
          for key in ('wildcard','free_hit','bench_boost','triple_captain'):
              assert gate[key]['status'] in ('HOLD','WATCH','CONSIDER')
          print('Simulation stability and chip gate validation passed')
          PY
      - name: Commit supplemental snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/simulation_stability.json data/chip_activation_gate.json
          if git diff --cached --quiet; then
            echo "No supplemental changes"
          else
            git commit -m "Update simulation stability and chip gate"
            git pull --rebase origin main
            git push origin main
          fi
