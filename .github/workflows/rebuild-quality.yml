name: Rebuild Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "spec/**"
      - ".github/workflows/rebuild-quality.yml"
  push:
    branches:
      - "codex/spec-driven-rebuild-pack"
    paths:
      - "app/**"
      - "spec/**"
      - ".github/workflows/rebuild-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
